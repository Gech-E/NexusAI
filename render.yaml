# Render Blueprint: production foundation. Deploy only after review.
services:
  - type: web
    name: nexus-learnai-api
    runtime: docker
    repo: https://github.com/Gech-E/NexusAI
    branch: main
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/v1/health/ready
    # Free web services do not support pre-deploy commands.
    # For the portfolio demo, initialize the empty DB on process startup.
    dockerCommand: sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000} --workers 1'
    autoDeployTrigger: off
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-learnai-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
databases:
  - name: nexus-learnai-postgres
    databaseName: nexus_learnai
    user: nexus_learnai
    plan: free
    postgresMajorVersion: "17"
