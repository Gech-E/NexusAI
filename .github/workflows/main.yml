name: Nexus LearnAI CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run linting
      run: |
        cd backend
        python -m compileall -q app
        python -m pytest -q tests

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        check-latest: true
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: Run typecheck and lint
      run: |
        cd frontend
        npm run typecheck
        npm run lint
    - name: Run build
      run: |
        cd frontend
        npm run build

  build-and-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    # Add steps to login to Docker Hub and push images here
    - name: Build Backend Image
      run: docker build -t nexus-learnai/backend:latest ./backend
    - name: Build Frontend Image
      run: docker build -t nexus-learnai/frontend:latest ./frontend
