version: '3.8'

services:
  # ── Database ──
  db:
    image: postgres:18
    container_name: nexus_db
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus_learnai
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_learnai"]
      interval: 10s
      retries: 5

  # ── Redis (cache + message broker) ──
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  # ── Redis Exporter (Prometheus metrics) ──
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: nexus_redis_exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    expose:
      - "9121"
    depends_on:
      - redis
    restart: unless-stopped

  # ── Backend API ──
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus_user:${POSTGRES_PASSWORD}@db:5432/nexus_learnai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      DEBUG: 'false'
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS domain}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker ──
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexus_celery
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      APP_ENV: production
      DEBUG: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS domain}
      DATABASE_URL: postgresql+asyncpg://nexus_user:${POSTGRES_PASSWORD}@db:5432/nexus_learnai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # ── Frontend ──
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    environment:
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    ports:
      # Bind only to loopback; provide HTTPS via a trusted upstream ingress.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ── Prometheus Monitoring ──
  prometheus:
    image: prom/prometheus:latest
    container_name: nexus_prometheus
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # ── Grafana Dashboard ──
  grafana:
    image: grafana/grafana:latest
    container_name: nexus_grafana
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
